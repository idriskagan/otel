name: Python Unit Tests CI

on:
  push:
    branches: [ "main", "auth-testleri" ]
  pull_request:
    branches: [ "main", "auth-testleri" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.9 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Bagimliliklari Yukle (Install Dependencies)
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Unit Testleri Calistir (Run Tests)
      run: |
        python -m unittest discover tests -v
