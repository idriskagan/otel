# ============================================================
# docker-compose.yml — Otel Rezervasyon Web Uygulaması
# ============================================================
# Kullanım:
#   docker compose up -d          # Arka planda başlat
#   docker compose down           # Durdur ve temizle
#   docker compose logs -f        # Logları izle
# ============================================================

version: '3.8'

services:
  web:
    build: .
    container_name: otel-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-production-gizli-anahtar}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///otel.db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/app/static/uploads
      - db_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads:
  db_data:
